name: Pi Server Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test requirements
        run: python -m pip install aiohttp pillow qrcode
      - name: Backend tests
        run: python -m unittest discover -s tests -p 'test_remote.py' -v
      - name: Frontend tests
        run: node --test tests/test_frontend.cjs
      - name: Syntax checks
        run: python -m compileall -q server.py qr_display.py tests
